name: Film4K Hancock probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe runtime
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Probe Hancock playlists
        run: |
          set +e
          python scripts/hancock_probe.py https://film4k.net/movie/hancock --timeout 60
          code=$?
          if [ -f .local/film4k-probe/summary.json ]; then
            cat .local/film4k-probe/summary.json
          fi
          exit $code
